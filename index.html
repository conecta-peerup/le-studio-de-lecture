<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#fff6e3">
<title>Le studio de lecture</title>
<style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);color-scheme:light}html{background:#fff6e3}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Le studio de lecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Andika:wght@400;700&display=swap">
<style>
  :root{
    color-scheme:light;
    --bg:#fff6e3;--bg2:#ffeecd;--card:#ffffff;--ink:#2f2518;--ink-soft:#7d7060;
    --line:#e6d8bd;--shadow:#e0cda6;--gold:#f2b705;--good:#3fa06a;--bad:#e2614a;
    --accent-l:42%;--accent-d:30%;--wash-l:93%;
    --display:"Fredoka","Trebuchet MS",sans-serif;
    --body:"Andika","Trebuchet MS","Segoe UI",sans-serif;
  }

  *{box-sizing:border-box}
  body{
    margin:0;padding-block:18px 48px;padding-inline:16px;
    background:var(--bg);color:var(--ink);
    font-family:var(--body);font-size:16px;line-height:1.45;
    overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:620px;margin:0 auto}
  .acc{--a:hsl(var(--h) 62% var(--accent-l));--ad:hsl(var(--h) 62% var(--accent-d));--aw:hsl(var(--h) 62% var(--wash-l))}

  .hero{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--bg2);border:3px solid var(--line);border-radius:22px;
    padding:14px 16px;box-shadow:0 5px 0 var(--shadow);margin-bottom:16px;
  }
  h1{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,5.4vw,1.75rem);margin:0;letter-spacing:-.01em}
  .ver{font-family:var(--display);font-size:.6rem;color:var(--ink-soft);vertical-align:super;margin-left:5px;letter-spacing:.06em}
  .starchip{font-family:var(--display);font-weight:700;font-size:1.05rem;background:var(--gold);color:#3a2a00;border-radius:999px;padding:6px 14px;white-space:nowrap}

  .sections{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
  .sec{
    --h:40;background:var(--card);border:3px solid var(--line);border-radius:18px;
    padding:12px 5px 10px;cursor:pointer;color:var(--ink);
    font-family:var(--display);font-weight:600;font-size:.84rem;line-height:1.15;
    box-shadow:0 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s;
  }
  .sec .ico{display:block;font-size:1.7rem;line-height:1.2}
  .sec[aria-selected="true"]{background:hsl(var(--h) 62% var(--wash-l));border-color:hsl(var(--h) 62% var(--accent-l));box-shadow:0 4px 0 hsl(var(--h) 62% var(--accent-l))}
  .sec:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
  .sec:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  .series{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .serie{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;
    width:100%;text-align:left;background:var(--card);
    border:3px solid var(--line);border-radius:16px;padding:10px 12px;
    font-family:var(--body);color:var(--ink);cursor:pointer;
    box-shadow:0 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s;
  }
  .serie:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
  .serie:focus-visible{outline:3px solid var(--a);outline-offset:3px}
  .serie.done{border-color:var(--gold);box-shadow:0 4px 0 var(--gold)}
  .badge{font-family:var(--display);font-weight:700;font-size:.86rem;background:var(--a);color:#fff;padding:6px 11px;border-radius:11px;white-space:nowrap}
  .serie.rev .badge{background:var(--aw);color:var(--ad);border:2px dashed var(--a)}
  .smeta{font-size:.78rem;color:var(--ink-soft)}
  .smeta b{color:var(--ink)}
  .sstars{font-size:.95rem;letter-spacing:1px;white-space:nowrap;filter:grayscale(1);opacity:.35}
  .sstars.on{filter:none;opacity:1}

  .xtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .back{background:var(--card);border:3px solid var(--line);color:var(--ink);border-radius:14px;padding:9px 15px;font-family:var(--display);font-size:1.1rem;cursor:pointer;box-shadow:0 4px 0 var(--shadow)}
  .back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
  .xtitle{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--a);margin:0;flex:1;text-align:right}

  .modes{display:flex;gap:8px;margin-bottom:14px}
  .mode{
    flex:1 1 0;padding:10px 4px;border:3px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:15px;font-family:var(--display);font-weight:600;font-size:.82rem;
    cursor:pointer;box-shadow:0 4px 0 var(--shadow);line-height:1.2;
  }
  .mode .ico{display:block;font-size:1.3rem}
  .mode[aria-selected="true"]{background:var(--a);border-color:var(--ad);color:#fff;box-shadow:0 4px 0 var(--ad)}
  .mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
  .mode:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  .deck{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--bg2);border:3px solid var(--line);border-radius:18px;padding:11px 13px;margin-bottom:12px}
  .clock{font-family:var(--display);font-weight:700;font-size:2rem;font-variant-numeric:tabular-nums;min-width:3.2ch}
  .clock.go{color:var(--bad)}
  .gobtn{background:var(--a);color:#fff;border:none;border-radius:14px;padding:11px 18px;font-family:var(--display);font-weight:600;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 var(--ad)}
  .gobtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ad)}
  .deckinfo{flex:1 1 150px;font-size:.8rem;color:var(--ink-soft);min-width:0}
  .deckinfo b{color:var(--a)}

  .sheet{background:var(--bg2);border:3px solid var(--line);border-radius:18px;padding:10px;overflow-x:auto;box-shadow:0 5px 0 var(--shadow)}
  .srow{padding:6px 0;border-bottom:1px dashed var(--line)}
  .srow:last-child{border-bottom:none}
  .scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:6px}
  .stally{display:block;text-align:right;margin-top:5px;padding-right:2px;
          font-size:.7rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .cell,.chip{background:var(--bg2);border:2px solid var(--line);border-radius:11px;padding:10px 3px;font-family:var(--body);color:var(--ink);cursor:pointer;text-align:center;line-height:1.2;word-break:break-word}
  .cell{font-size:clamp(1.05rem,4.8vw,1.5rem);padding:12px 4px;min-height:52px}
  .cell.read,.chip.read{background:var(--aw)}
  .cell.here,.chip.here{background:var(--a);color:#fff}
  .cell.here .hi,.chip.here .hi{color:#fff}
  .hi{color:var(--a);font-weight:700}

  .wrow{padding:7px 0;border-bottom:1px dashed var(--line)}
  .wrow:last-child{border-bottom:none}
  .wcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;align-items:stretch}
  .chip{padding:9px 6px;font-size:clamp(.92rem,3.8vw,1.1rem);font-weight:700;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:6px;line-height:1.15;border-radius:14px;background:var(--card);border:2px solid var(--line)}
  .cpic{display:flex;align-items:center;justify-content:center;font-size:3rem;line-height:1;width:100%}
  .cpic svg{width:1em;height:1em}
  .cpic:empty{display:none}
  .wtally{display:block;text-align:right;margin-top:5px;padding-right:2px;
          font-size:.7rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  /* ---------- jeux ---------- */
  .quiz{text-align:center}
  .qbar{display:flex;align-items:center;gap:7px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
  .dot{width:13px;height:13px;border-radius:50%;background:var(--line)}
  .dot.ok{background:var(--good)}
  .dot.no{background:var(--bad)}
  .dot.now{box-shadow:0 0 0 3px var(--aw)}

  .ask{
    background:var(--card);border:3px solid var(--a);border-radius:24px;
    padding:18px 14px;box-shadow:0 6px 0 var(--ad);margin-bottom:14px;
  }
  .askword{font-size:clamp(2.2rem,14vw,3.6rem);font-weight:700;margin:0;line-height:1.1;word-break:break-word}
  .bigplay{
    width:100%;min-height:92px;border:none;border-radius:20px;background:var(--a);color:#fff;
    font-family:var(--display);font-weight:600;font-size:1.1rem;cursor:pointer;box-shadow:0 5px 0 var(--ad);
  }
  .bigplay .ico{display:block;font-size:2.6rem;line-height:1.1}
  .bigplay:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ad)}
  .hintline{margin:10px 0 0;font-family:var(--display);font-size:.95rem;color:var(--ink-soft);min-height:1.5em}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{
    min-height:112px;border:3px solid var(--line);border-radius:20px;background:var(--card);
    color:var(--ink);font-family:var(--body);font-weight:700;
    font-size:clamp(1.4rem,8vw,2.2rem);cursor:pointer;box-shadow:0 5px 0 var(--shadow);
    display:flex;align-items:center;justify-content:center;padding:8px;word-break:break-word;line-height:1.15;
  }
  .opt.img{font-size:clamp(2.6rem,16vw,4rem)}
  .opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
  .opt:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .opt.win{background:var(--good);border-color:var(--good);color:#fff;box-shadow:0 5px 0 var(--good)}
  .opt.lose{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 5px 0 var(--bad)}
  .opt.dim{opacity:.4}

  .party{text-align:center;padding:14px 0}
  .party .big{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,16vw,4rem);color:var(--gold);margin:4px 0}
  .party .emo{font-size:clamp(3rem,18vw,5rem);display:block}
  .pop{animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  .shake{animation:shk .3s ease}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  .again{
    margin-top:14px;width:100%;min-height:60px;border:none;border-radius:18px;
    background:var(--gold);color:#3a2a00;font-family:var(--display);font-weight:700;font-size:1.1rem;
    cursor:pointer;box-shadow:0 5px 0 #c79400;
  }
  .again:active{transform:translateY(4px);box-shadow:0 1px 0 #c79400}

  .pic svg,.cpic svg,.optpic svg{width:1em;height:1em;display:block}
  .optpic{font-size:clamp(3.4rem,20vw,5rem);line-height:1}
  .pic{font-size:clamp(3rem,17vw,4.6rem);line-height:1;display:block;margin-bottom:2px}

  .serie.lock{opacity:.5}
  .serie.lock .badge{background:var(--line);color:var(--ink-soft)}
  .lockico{font-size:1.1rem}
  .legend{font-size:.76rem;color:var(--ink-soft);margin:0 0 12px;text-align:center}
  .legend b{color:var(--gold)}

  .start{text-align:center;padding:30px 16px 24px;background:var(--card);border:3px solid var(--line);
         border-radius:26px;box-shadow:0 6px 0 var(--shadow)}
  .start .hi{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,8vw,2.4rem);margin:8px 0 2px}
  .start .st{font-family:var(--display);font-size:1.3rem;color:var(--gold);margin:6px 0 18px}
  .start input{width:100%;max-width:280px;padding:13px;border:3px solid var(--line);border-radius:16px;
               background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;
               font-size:1.2rem;text-align:center;margin-bottom:14px}
  .start input:focus{outline:none;border-color:var(--gold)}
  .start button{width:100%;max-width:280px;min-height:64px;border:none;border-radius:20px;background:var(--gold);
                color:#3a2a00;font-family:var(--display);font-weight:700;font-size:1.25rem;cursor:pointer;
                box-shadow:0 5px 0 #c79400}
  .start button:active{transform:translateY(4px);box-shadow:0 1px 0 #c79400}
  .start .bigpic{font-size:4.2rem;line-height:1}
  .start .bigpic svg{width:1em;height:1em;display:inline-block}

  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">

  <!-- ============ DÉPART ============ -->
  <section id="start">
    <div class="start">
      <span class="bigpic" id="startPic">📖</span>
      <p class="hi" id="hi">Salut !</p>
      <p class="st" id="startStars">⭐ 0</p>
      <input id="nameIn" type="text" maxlength="14" placeholder="Ton prénom" autocomplete="off" hidden>
      <button id="go" type="button">C'est parti !</button>
    </div>
  </section>

  <!-- ============ ACCUEIL ============ -->
  <section id="home" hidden>
    <div class="hero">
      <h1>Le studio de lecture</h1>
      <span class="starchip" id="starChip">⭐ 0</span>
    </div>

    <div class="sections" role="tablist">
      <button class="sec" role="tab" id="sec-syl" aria-selected="true" style="--h:265" type="button"><span class="ico">🔤</span>Syllabes</button>
      <button class="sec" role="tab" id="sec-mot" aria-selected="false" style="--h:195" type="button"><span class="ico">📖</span>Mots</button>
      <button class="sec" role="tab" id="sec-out" aria-selected="false" style="--h:150" type="button"><span class="ico">🔑</span>Mots outils</button>
    </div>

    <p class="legend">Une <b>★</b> par jeu réussi : la feuille, Écoute, Images.</p>
    <ul class="series" id="serieList"></ul>
  </section>

  <!-- ============ EXERCICE ============ -->
  <section id="exo" hidden>
    <div class="xtop">
      <button class="back" id="back" type="button">←</button>
      <p class="xtitle" id="xTitle"></p>
    </div>

    <div class="modes" role="tablist">
      <button class="mode" id="m-feuille" role="tab" aria-selected="true" type="button"><span class="ico">📄</span>La feuille</button>
      <button class="mode" id="m-ecoute" role="tab" aria-selected="false" type="button"><span class="ico">👂</span>Écoute</button>
      <button class="mode" id="m-image" role="tab" aria-selected="false" type="button"><span class="ico">🖼️</span>Images</button>
    </div>

    <!-- 📄 feuille -->
    <div id="vFeuille">
      <div class="deck">
        <span class="clock" id="clock">1:00</span>
        <button class="gobtn" id="timerBtn" type="button">▶ Go !</button>
        <span class="deckinfo" id="deckInfo">Touche une case pour l'écouter.</span>
      </div>
      <div class="sheet" id="sheet"></div>
    </div>

    <!-- 👂 écoute : j'entends → je touche -->
    <div id="vEcoute" hidden class="quiz">
      <div class="qbar" id="eBar"></div>
      <div class="ask">
        <button class="bigplay" id="ePlay" type="button"><span class="ico">🔊</span>Écoute !</button>
        <p class="hintline" id="eHint">Touche la bonne case.</p>
      </div>
      <div class="opts" id="eOpts"></div>
    </div>

    <!-- 🖼️ images : je lis → je touche l'image -->
    <div id="vImage" hidden class="quiz">
      <div class="qbar" id="iBar"></div>
      <div class="ask">
        <p class="askword" id="iWord"></p>
        <p class="hintline" id="iHint">Quelle image ?</p>
      </div>
      <div class="opts" id="iOpts"></div>
    </div>
  </section>

</div>

<script src="js/datos.js"></script>
<script src="js/audio.js"></script>
<script src="js/imagenes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
